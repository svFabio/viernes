[project]
name = "viernes"
version = "0.1.0"
description = "Voice assistant with resilient TTS fallback and agent integration"
readme = "README.md"
authors = [
    { name = "svFabio", email = "svfabio.andres@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "elevenlabs>=2.75.0",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
]

[project.scripts]
viernes = "viernes.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "BLE001",
    "F401",
    "FURB122",
    "I001",
    "PIE790",
    "RUF022",
    "RUF059",
    "UP035",
    "UP045",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "sounddevice.*"
ignore_missing_imports = true


