[workspace]
members = [
    "crates/viernes-core",
    "crates/viernes-brain",
    "crates/viernes-audio",
    "crates/viernes-tts",
    "crates/viernes-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
authors = ["svFabio"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }

[workspace.dependencies]
viernes-core = { path = "crates/viernes-core" }
viernes-brain = { path = "crates/viernes-brain" }
viernes-audio = { path = "crates/viernes-audio" }
viernes-tts = { path = "crates/viernes-tts" }

tokio = { version = "1.38", features = ["full"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
proptest = "1.4"
tempfile = "3.10"
async-trait = "0.1"
futures = "0.3"
nix = { version = "0.29", features = ["signal", "process"] }
dotenvy = "0.15"
crossbeam-channel = "0.5"
cpal = "0.15"
hound = "3.5"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

